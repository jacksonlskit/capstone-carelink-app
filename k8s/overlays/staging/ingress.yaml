apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carelink-alb-ingress
  labels:
    app.kubernetes.io/name: carelink
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/success-codes: "200"
    # Project must match the cohort cleanup tag exactly. The infra repo also sets
    # it as the controller's defaultTags; keep both identical.
    alb.ingress.kubernetes.io/tags: Project=capstone-project-group-03,Environment=staging
    # external-dns (installed by the infra repo) points this hostname at
    # whichever ALB exists today; the environment is rebuilt every day.
    external-dns.alpha.kubernetes.io/hostname: carelink-staging.sctp-sandbox.com
spec:
  ingressClassName: alb
  # The controller finds the ACM certificate for this host on its own,
  # so no certificate ARN is hard-coded here.
  tls:
    - hosts:
        - carelink-staging.sctp-sandbox.com
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
