
name: CD Staging - Build, Push & GitOps Update

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push CareLink Images
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Application
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          SERVICES=("api-gateway" "customers-service" "vets-service" "visits-service")

          for SERVICE in "${SERVICES[@]}"; do
            REPO_NAME="carelink-staging-${SERVICE}"

            echo "Building ${SERVICE}..."
            docker build \
              -t "${REGISTRY}/${REPO_NAME}:${IMAGE_TAG}" \
              -f "services/${SERVICE}/Dockerfile" .

            echo "Pushing ${SERVICE}..."
            docker push "${REGISTRY}/${REPO_NAME}:${IMAGE_TAG}"
          done

      - name: Upload Helm Chart
        uses: actions/upload-artifact@v4
        with:
          name: carelink-helm-chart
          path: deploy/charts/carelink/
          if-no-files-found: error

  update-staging-gitops:
    name: Update Staging GitOps Branch
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Staging GitOps Branch
        uses: actions/checkout@v4
        with:
          ref: env/staging
          fetch-depth: 0

      - name: Preserve Staging Values
        run: |
          set -euo pipefail
          test -f deploy/charts/carelink/values-staging.yaml
          cp deploy/charts/carelink/values-staging.yaml /tmp/values-staging.yaml

      - name: Download Helm Chart
        uses: actions/download-artifact@v4
        with:
          name: carelink-helm-chart
          path: chart-artifact

      - name: Publish Chart and Update Image SHA
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p deploy/charts/carelink
          cp -R chart-artifact/. deploy/charts/carelink/
          cp /tmp/values-staging.yaml deploy/charts/carelink/values-staging.yaml

          sed -i -E "s|^  imageTag:.*|  imageTag: \"${IMAGE_TAG}\"|" \
            deploy/charts/carelink/values-staging.yaml

      - name: Commit and Push Staging GitOps Changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deploy/charts/carelink/

          if git diff --cached --quiet; then
            echo "No staging GitOps changes."
          else
            git commit -m "chore(gitops): update staging CareLink chart"
            git push origin HEAD:env/staging
          fi
