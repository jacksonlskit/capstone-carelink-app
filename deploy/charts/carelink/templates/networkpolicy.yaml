{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: carelink-allow-same-namespace
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: carelink
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
{{- end }}
