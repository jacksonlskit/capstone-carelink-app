{{- /*
PodDisruptionBudget per service: voluntary disruptions must leave at least
one pod of every service running. Only created when a service runs more
than one replica.
*/ -}}
{{- range $name, $svc := .Values.services }}
{{- $replicas := int ($svc.replicaCount | default $.Values.global.replicaCount) }}
{{- if gt $replicas 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ $name }}
{{- end }}
{{- end }}
