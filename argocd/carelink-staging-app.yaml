apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: carelink-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jacksonlskit/capstone-carelink-app.git
    targetRevision: HEAD
    path: charts/carelink
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
