# Base values for every environment. Environment differences live in
# values-<environment>.yaml. Argo CD renders: values.yaml + values-<env>.yaml.

global:
  environment: base
  imageRegistry: "255945442255.dkr.ecr.us-east-1.amazonaws.com"
  # ECR repository prefix; images are <imageRegistry>/<imagePrefix>-<service>:<imageTag>.
  # Set per environment (carelink-staging / carelink-production).
  imagePrefix: ""
  # Git SHA of the build. Left empty on main on purpose: the app pipeline
  # writes it into values-<env>.yaml on the env/<env> branch when it deploys.
  # Rendering fails if it is empty, so an untagged image can never be deployed.
  imageTag: ""
  # At least 2 pods per service, spread over nodes, so losing one pod or node
  # does not take a service down (Use Case B: no single point of failure).
  replicaCount: 2

ingress:
  enabled: false
  name: carelink-alb-ingress
  className: alb
  path: /
  pathType: Prefix
  service:
    name: api-gateway
    port: 8080
  # Hostnames for TLS; the AWS Load Balancer Controller finds the ACM
  # certificate by hostname (certificates live in the infra repo's bootstrap).
  tlsHosts: []
  annotations: {}

# Database: RDS MySQL per environment. The Secret below (url, username,
# password) is created by External Secrets from the RDS-managed secret in
# Secrets Manager (infra repo, app-database.tf); this chart never sees a password.
database:
  secretName: carelink-db

# Ports must match the gateway routes in templates/configmap.yaml.
services:
  api-gateway:
    port: 8080
    resources:
      requests:
        cpu: "150m"
        memory: "384Mi"
      limits:
        cpu: "500m"
        memory: "768Mi"

  customers-service:
    port: 8081
    database: true
    resources:
      requests:
        cpu: "150m"
        memory: "384Mi"
      limits:
        cpu: "500m"
        memory: "768Mi"

  vets-service:
    port: 8082
    database: true
    resources:
      requests:
        cpu: "150m"
        memory: "384Mi"
      limits:
        cpu: "500m"
        memory: "768Mi"

  visits-service:
    port: 8083
    database: true
    resources:
      requests:
        cpu: "150m"
        memory: "384Mi"
      limits:
        cpu: "500m"
        memory: "768Mi"
