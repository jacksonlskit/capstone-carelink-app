global:
  environment: base
  imageRegistry: "255945442255.dkr.ecr.us-east-1.amazonaws.com"
  imagePullPolicy: IfNotPresent

# Default Ingress is disabled in base; activated via environment values files
ingress:
  enabled: false
  className: "alb"
  path: "/"
  pathType: "Prefix"
  service:
    name: "api-gateway"
    port: 8080
  annotations: {}

services:
  apiGateway:
    name: api-gateway
    image:
      repository: "carelink/api-gateway"
      tag: "latest"
    replicaCount: 2
    port: 8080
    resources:
      requests:
        cpu: "150m"
        memory: "384Mi"
      limits:
        cpu: "500m"
        memory: "768Mi"
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 8080
      initialDelaySeconds: 45
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10

  customersService:
    name: customers-service
    image:
      repository: "carelink/customers-service"
      tag: "latest"
    replicaCount: 2
    port: 8081
    resources:
      requests:
        cpu: "150m"
        memory: "384Mi"
      limits:
        cpu: "500m"
        memory: "768Mi"
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 8081
      initialDelaySeconds: 45
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 8081
      initialDelaySeconds: 30
      periodSeconds: 10

  vetsService:
    name: vets-service
    image:
      repository: "carelink/vets-service"
      tag: "latest"
    replicaCount: 2
    port: 8083
    resources:
      requests:
        cpu: "150m"
        memory: "384Mi"
      limits:
        cpu: "500m"
        memory: "768Mi"
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 8083
      initialDelaySeconds: 45
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 8083
      initialDelaySeconds: 30
      periodSeconds: 10

  visitsService:
    name: visits-service
    image:
      repository: "carelink/visits-service"
      tag: "latest"
    replicaCount: 2
    port: 8082
    resources:
      requests:
        cpu: "150m"
        memory: "384Mi"
      limits:
        cpu: "500m"
        memory: "768Mi"
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 8082
      initialDelaySeconds: 45
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 8082
      initialDelaySeconds: 30
      periodSeconds: 10
