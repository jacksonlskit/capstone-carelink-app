# Production overrides (Argo CD Application carelink-production, namespace production).
# Deployed only after the "production" GitHub environment approval in cd.yaml.
global:
  environment: production
  imagePrefix: carelink-production
  # Set by the app pipeline on branch env/production; empty on main on purpose.
  imageTag: "56eb9a04c3a1363be383cfb260536a697e2da244"

ingress:
  enabled: true
  tlsHosts:
    - carelink-production.sctp-sandbox.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/success-codes: "200"
    # Project must match the cohort cleanup tag exactly (also the controller's defaultTags).
    alb.ingress.kubernetes.io/tags: Project=capstone-project-group-03,Environment=production
    # external-dns (infra repo) points this hostname at the current ALB.
    external-dns.alpha.kubernetes.io/hostname: carelink-production.sctp-sandbox.com
