apiVersion: v1
kind: ConfigMap
metadata:
  name: petclinic-config
data:
  application.yml: |
    spring:
      cloud:
        gateway:
          routes:
            - id: vets-service
              uri: http://vets-service:8082
              predicates:
                - Path=/api/vet/**
              filters:
                - StripPrefix=2
            - id: customers-service
              uri: http://customers-service:8081
              predicates:
                - Path=/api/customer/**
              filters:
                - StripPrefix=2
            - id: visits-service
              uri: http://visits-service:8083
              predicates:
                - Path=/api/visit/**
              filters:
                - StripPrefix=2

    # Database: RDS MySQL. The connection URL, user and password come from the
    # carelink-db Secret (environment variables SPRING_DATASOURCE_*, see
    # deployments.yaml); nothing about the database is configured here except
    # the schema scripts.
    # The services' db/mysql scripts only use CREATE ... IF NOT EXISTS and
    # INSERT IGNORE, so running them on every start never changes or deletes
    # existing rows: data written by users survives restarts and redeploys.
    spring.sql.init.mode: always
    spring.sql.init.schema-locations: classpath*:db/mysql/schema.sql
    spring.sql.init.data-locations: classpath*:db/mysql/data.sql
    spring.jpa.hibernate.ddl-auto: none
